<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload MEMEs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="trending-header">
        <h1>Studio Upload</h1>
        <div class="nav-group">
            <a href="homepage.html" class="nav-btn">← Back to Trending</a>
        </div>
    </div>
    <div class="upload-container" style="margin-top: 120px;">
        <h2>Upload New MEME</h2>
        <form id="uploadForm">
            <input type="text" id="upload-title" placeholder="MEME Title" required>
            <input type="file" id="upload-file" accept="image/*" required style="margin: 15px 0;">
            <button type="submit" id="upload-btn" style="background-color: #10b981;">Publish MEME</button>
        </form>
        <div id="upload-status" style="margin-top: 15px;"></div>
    </div>
    <script src="upload.js"></script>
</body>
</html>
